name: Daily Beauty Digest

on:
  # Run every day at 13:00 UTC (9am ET / 6am PT / 6:30pm IST).
  # Edit the cron below to change the time. Format: "min hour * * *" in UTC.
  # Use https://crontab.guru to design your own schedule.
  schedule:
    - cron: "0 13 * * *"
  # Lets you run it manually from the GitHub Actions tab (useful for testing).
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOOKBACK_HOURS: "24"
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
        run: python agent.py
